spring.application.name=Java spring LLM

# File upload settings - max file size 25MB
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# HTTP client timeout settings - 60 seconds
spring.mvc.async.request-timeout=60000

# Ollama (LLM) endpoint (used for both text and vision models)
ollama.base-url=http://localhost:11434
